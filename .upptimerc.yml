# Pagina di stato dei servizi dell'Officina Tecnologica
# Documentazione: https://upptime.js.org/docs/configuration/
owner: Dhareck
repo: status-officina
user-agent: Dhareck

# Riceve le notifiche GitHub quando si apre un incidente
assignees:
  - Dhareck

sites:
  - name: Sito dell'officina
    slug: sito
    url: https://officinatecnologica.eu
    maxResponseTime: 10000
  - name: Forgejo
    slug: forgejo
    url: https://git.officinatecnologica.eu/api/healthz
    maxResponseTime: 10000
  - name: Chat Matrix
    slug: matrix
    url: https://matrix.officinatecnologica.eu/_matrix/client/versions
    maxResponseTime: 10000
  - name: BananaWiki
    slug: bananawiki
    url: https://officina.bananawiki.com/login
    maxResponseTime: 10000
  - name: BananaWiki Hosting Platform
    slug: hosting
    url: https://hosting.bananawiki.com/login
    maxResponseTime: 10000
  - name: BananaChat
    slug: bananachat
    url: https://chat.bananawiki.com/login
    maxResponseTime: 10000

status-website:
  cname: status.officinatecnologica.eu
  name: Officina Tecnologica · Stato dei servizi
  logoUrl: https://status.officinatecnologica.eu/logo.png
  favicon: https://status.officinatecnologica.eu/logo.png
  theme: dark
  introTitle: "**Stato dei servizi** dell'Officina Tecnologica"
  introMessage: "Controllo automatico circa ogni 5 minuti di sito, Forgejo, chat Matrix e BananaSuite. Se un servizio risulta non disponibile, l'incidente compare qui sotto finché non viene risolto."
  navbar:
    - title: Stato
      href: /
    - title: Sito dell'officina
      href: https://officinatecnologica.eu
    - title: Servizi interni
      href: https://officinatecnologica.eu/servizi.html
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  # Colori allineati al sito officinatecnologica.eu
  css: ":root{--body-background-color:#0b1017;--body-text-color:#e8edf8;--card-background-color:#111a29;--nav-background-color:#111a29;--nav-border-bottom-color:#232e48;--nav-current-border-bottom-color:#4f8cff;--card-border-color:#232e48;--tag-color:#07122b;--error-button-border-color:#4f8cff;--error-button-background-color:#4f8cff;--error-button-color:#07122b;--submit-button-border-color:#4f8cff;--submit-button-background-color:#4f8cff;--submit-button-color:#07122b}"

graphBackgroundColor: "#1a2a4d"
graphBorderColor: "#4f8cff"

